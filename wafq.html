<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مولد الأوفاق الرقمية والأسمائية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #121722;
      --surface-2: #182030;
      --gold: #d4af37;
      --gold-bright: #f0cf65;
      --gold-soft: rgba(212, 175, 55, 0.14);
      --gold-border: rgba(212, 175, 55, 0.35);
      --text: #f3f5f8;
      --muted: #9aa5b8;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #171f30 0%, var(--bg) 62%);
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      line-height: 1.7;
      min-height: 100vh;
      padding: 24px 16px 70px;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-link {
      text-decoration: none;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .nav-link.active, .nav-link:hover {
      color: var(--gold-bright);
      border-color: var(--gold-border);
      background: var(--gold-soft);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 24px 18px;
      background: linear-gradient(180deg, rgba(212,175,55,0.09), rgba(18,23,34,0.68));
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
    }

    header h1 {
      font-family: 'Amiri', serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: var(--gold);
      margin-bottom: 6px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 14px 35px rgba(0,0,0,0.3);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .field {
      flex: 1 1 200px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="number"], select {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
      font-family: inherit;
      font-size: 0.96rem;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--gold);
    }

    .mode-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-mode {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .btn-mode.active {
      background: var(--gold-soft);
      color: var(--gold-bright);
      border-color: var(--gold);
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .summary-box {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .summary-box .k { font-size: 0.85rem; color: var(--muted); }
    .summary-box .v {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--gold-bright);
      margin-top: 4px;
    }

    .wafq-wrapper {
      overflow-x: auto;
      padding: 10px 0;
    }

    .wafq-grid {
      display: grid;
      gap: 8px;
      margin: 0 auto;
      width: fit-content;
    }

    .wafq-cell {
      min-width: 86px;
      min-height: 76px;
      padding: 8px 6px;
      background: var(--surface-2);
      border: 1px solid var(--gold-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--text);
    }

    .wafq-cell.center-cell {
      background: var(--gold-soft);
      border-color: var(--gold-bright);
      color: var(--gold-bright);
    }

    .wafq-cell.unmatched {
      color: var(--muted);
      border-style: dashed;
    }

    .paywall-box {
      text-align: center;
      padding: 28px 18px;
      background: var(--surface-2);
      border: 1px solid var(--gold-border);
      border-radius: 14px;
      display: grid;
      gap: 12px;
      max-width: 520px;
      margin: 12px auto;
    }

    .paywall-box h3 {
      color: var(--gold-bright);
      font-size: 1.2rem;
    }

    .paywall-box p {
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-bar">
      <div class="nav-links">
        <a href="index.html" class="nav-link">حاسبة الجُمّل والطبائع</a>
        <a href="wafq.html" class="nav-link active">الاوفاق</a>
      </div>
    </nav>

    <header>
      <h1>مولد الأوفاق الرقمية والأسمائية</h1>
      <p>توليد شبكة وفق من 3×3 إلى 10×10 بأرقام غير مكررة، ومطابقتها مع الأسماء الحسنى بالـ التعريف أو بدونها.</p>
    </header>

    <section class="card">
      <div class="controls-row">
        <div class="field">
          <label for="targetSum">الرقم المستهدف (المجموع)</label>
          <input type="number" id="targetSum" min="1" placeholder="أدخل رقماً..." />
        </div>
        <div class="field">
          <label for="gridSize">مرتبة الوفق</label>
          <select id="gridSize">
            <option value="3">3 × 3 (مجاني)</option>
            <option value="4">4 × 4 (مجاني)</option>
            <option value="5">5 × 5 (مجاني)</option>
            <option value="6">6 × 6</option>
            <option value="7">7 × 7</option>
            <option value="8">8 × 8</option>
            <option value="9">9 × 9</option>
            <option value="10">10 × 10</option>
          </select>
        </div>
      </div>

      <div class="mode-btns">
        <button class="btn btn-mode active" id="btnNumeric" data-mode="numeric">وفق رقمي</button>
        <button class="btn btn-mode" id="btnWithAl" data-mode="withAl">وفق اسمي (بالـ التعريف)</button>
        <button class="btn btn-mode" id="btnWithoutAl" data-mode="withoutAl">وفق اسمي (بدون الـ التعريف)</button>
      </div>

      <div class="summary-strip">
        <div class="summary-box">
          <div class="k">المرتبة</div>
          <div class="v" id="metaSize">—</div>
        </div>
        <div class="summary-box">
          <div class="k">المجموع المستهدف</div>
          <div class="v" id="metaSum">—</div>
        </div>
        <div class="summary-box">
          <div class="k">النمط الحالي</div>
          <div class="v" id="metaMode">وفق رقمي</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="wafq-wrapper" id="wafqOutput"></div>
    </section>
  </div>

  <script>
    const ABJAD_VALUES = {
      'ا': 1, 'أ': 1, 'إ': 1, 'آ': 1, 'ى': 1, 'ء': 1,
      'ب': 2, 'ج': 3, 'د': 4, 'ه': 5, 'ة': 5, 'و': 6, 'ؤ': 6,
      'ز': 7, 'ح': 8, 'ط': 9, 'ي': 10, 'ئ': 10, 'ك': 20, 'ل': 30,
      'م': 40, 'ن': 50, 'س': 60, 'ع': 70, 'ف': 80, 'ص': 90,
      'ق': 100, 'ر': 200, 'ش': 300, 'ت': 400, 'ث': 500, 'خ': 600,
      'ذ': 700, 'ض': 800, 'ظ': 900, 'غ': 1000
    };

    const ASMA_WITH_AL = [
      'الله', 'الرحمن', 'الرحيم', 'الملك', 'القدوس', 'السلام', 'المؤمن', 'المهيمن', 'العزيز', 'الجبار',
      'المتكبر', 'الخالق', 'البارئ', 'المصور', 'الغفار', 'القهار', 'الوهاب', 'الرزاق', 'الفتاح', 'العليم',
      'القابض', 'الباسط', 'الخافض', 'الرافع', 'المعز', 'المذل', 'السميع', 'البصير', 'الحكم', 'العدل',
      'اللطيف', 'الخبير', 'الحليم', 'العظيم', 'الغفور', 'الشكور', 'العلي', 'الكبير', 'الحفيظ', 'المقيت',
      'الحسيب', 'الجليل', 'الكريم', 'الرقيب', 'المجيب', 'الواسع', 'الحكيم', 'الودود', 'المجيد', 'الباعث',
      'الشهيد', 'الحق', 'الوكيل', 'القوي', 'المتين', 'الولي', 'الحميد', 'المحصي', 'المبدئ', 'المعيد',
      'المحيي', 'المميت', 'الحي', 'القيوم', 'الواجد', 'الماجد', 'الواحد', 'الأحد', 'الصمد', 'القادر',
      'المقتدر', 'المقدم', 'المؤخر', 'الأول', 'الآخر', 'الظاهر', 'الباطن', 'الوالي', 'المتعالي', 'البر',
      'التواب', 'المنتقم', 'العفو', 'الرؤوف', 'مالك الملك', 'ذو الجلال والإكرام', 'المقسط', 'الجامع', 'الغني', 'المغني',
      'المانع', 'الضار', 'النافع', 'النور', 'الهادي', 'البديع', 'الباقي', 'الوارث', 'الرشيد', 'الصبور'
    ];

    function stripAl(name) {
      return name
        .split(' ')
        .map(word => word.startsWith('ال') ? word.slice(2) : word)
        .join(' ');
    }

    function calcAbjad(text) {
      let total = 0;
      for (const ch of text) {
        if (ABJAD_VALUES[ch]) total += ABJAD_VALUES[ch];
      }
      return total;
    }

    const ASMA_WITHOUT_AL = ASMA_WITH_AL.map(name => ({
      display: stripAl(name),
      value: calcAbjad(stripAl(name))
    }));

    const ASMA_WITH_AL_LIST = ASMA_WITH_AL.map(name => ({
      display: name,
      value: calcAbjad(name)
    }));

    let currentMode = 'numeric';
    let unlockedLargeGrids = false;

    function buildUniqueMatrix(n, targetSum) {
      const totalCells = n * n;
      const baseMatrix = Array.from({ length: n }, () => Array(n).fill(0));

      if (n % 2 === 1) {
        let r = 0;
        let c = Math.floor(n / 2);
        for (let num = 1; num <= totalCells; num++) {
          baseMatrix[r][c] = num;
          const nextR = (r - 1 + n) % n;
          const nextC = (c + 1) % n;
          if (baseMatrix[nextR][nextC] !== 0) {
            r = (r + 1) % n;
          } else {
            r = nextR;
            c = nextC;
          }
        }
      } else {
        let counter = 1;
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            baseMatrix[r][c] = counter++;
          }
        }
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            const cond1 = (r % 4 === c % 4);
            const cond2 = ((r % 4) + (c % 4) === 3);
            if (cond1 || cond2) {
              baseMatrix[r][c] = (totalCells + 1) - baseMatrix[r][c];
            }
          }
        }
      }

      const magicConstant = (n * (totalCells + 1)) / 2;
      const diff = targetSum - magicConstant;

      return baseMatrix.map((row, rIdx) =>
        row.map((val, cIdx) => {
          const isCenter = (n % 2 === 1 && rIdx === Math.floor(n / 2) && cIdx === Math.floor(n / 2));
          return isCenter ? val + diff : val;
        })
      );
    }

    function getTraversalOrder(n) {
      const order = [];
      const visited = Array.from({ length: n }, () => Array(n).fill(false));
      const center = Math.floor(n / 2);

      if (n % 2 === 1) {
        let r = center;
        let c = center;
        order.push({ r, c });
        visited[r][c] = true;

        let step = 1;
        const dirs = [
          [0, 1],
          [1, 0],
          [0, -1],
          [-1, 0]
        ];
        let dirIdx = 0;

        while (order.length < n * n) {
          for (let rep = 0; rep < 2; rep++) {
            const [dr, dc] = dirs[dirIdx % 4];
            for (let s = 0; s < step; s++) {
              r += dr;
              c += dc;
              if (r >= 0 && r < n && c >= 0 && c < n && !visited[r][c]) {
                order.push({ r, c });
                visited[r][c] = true;
              }
            }
            dirIdx++;
          }
          step++;
        }
      } else {
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            order.push({ r, c });
          }
        }
      }

      return order;
    }

    function matchNameByTensMultiplier(cellValue, namesList) {
      if (!cellValue || cellValue <= 0) return null;
      const MAX_EXPONENT = 12;

      for (let exp = 0; exp <= MAX_EXPONENT; exp++) {
        const scaled = cellValue * Math.pow(10, exp);
        if (!Number.isSafeInteger(scaled)) break;
        const found = namesList.find(item => item.value === scaled);
        if (found) return found.display;
      }

      return null;
    }

    function renderWafq() {
      const n = parseInt(document.getElementById('gridSize').value, 10);
      const rawSum = parseInt(document.getElementById('targetSum').value, 10);
      const targetSum = Number.isFinite(rawSum) && rawSum > 0 ? rawSum : ((n * (n * n + 1)) / 2);

      const modeNames = {
        numeric: 'وفق رقمي',
        withAl: 'وفق اسمي (بالـ التعريف)',
        withoutAl: 'وفق اسمي (بدون الـ التعريف)'
      };

      document.getElementById('metaSize').textContent = `${n} × ${n}`;
      document.getElementById('metaSum').textContent = targetSum.toLocaleString('ar');
      document.getElementById('metaMode').textContent = modeNames[currentMode];

      const out = document.getElementById('wafqOutput');

      if (n >= 6 && !unlockedLargeGrids) {
        out.innerHTML = `
          <div class="paywall-box">
            <h3>الوفاق من ${n} × ${n} إلى 10 × 10</h3>
            <p>الوفاق من 3×3 إلى 5×5 متاحة مجاناً، والوفاق من 6×6 فأعلى مخصصة للنسخة الكاملة.</p>
            <button class="btn" id="unlockBtn">تفعيل العرض التجريبي</button>
          </div>
        `;
        document.getElementById('unlockBtn').addEventListener('click', () => {
          unlockedLargeGrids = true;
          renderWafq();
        });
        return;
      }

      const matrix = buildUniqueMatrix(n, targetSum);
      const traversal = getTraversalOrder(n);
      const displayGrid = Array.from({ length: n }, () => Array(n).fill(''));
      const matchedGrid = Array.from({ length: n }, () => Array(n).fill(true));

      const activeNames = currentMode === 'withAl' ? ASMA_WITH_AL_LIST : ASMA_WITHOUT_AL;

      for (const { r, c } of traversal) {
        const val = matrix[r][c];
        if (currentMode === 'numeric') {
          displayGrid[r][c] = String(val);
          matchedGrid[r][c] = true;
        } else {
          const matchedName = matchNameByTensMultiplier(val, activeNames);
          if (matchedName) {
            displayGrid[r][c] = matchedName;
            matchedGrid[r][c] = true;
          } else {
            displayGrid[r][c] = '—';
            matchedGrid[r][c] = false;
          }
        }
      }

      const gridEl = document.createElement('div');
      gridEl.className = 'wafq-grid';
      gridEl.style.gridTemplateColumns = `repeat(${n}, minmax(86px, 1fr))`;

      const centerIdx = Math.floor(n / 2);

      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const cell = document.createElement('div');
          const isCenter = (n % 2 === 1 && r === centerIdx && c === centerIdx);
          cell.className = 'wafq-cell' + (isCenter ? ' center-cell' : '') + (!matchedGrid[r][c] ? ' unmatched' : '');
          cell.textContent = displayGrid[r][c];
          gridEl.appendChild(cell);
        }
      }

      out.innerHTML = '';
      out.appendChild(gridEl);
    }

    document.querySelectorAll('.btn-mode').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        renderWafq();
      });
    });

    document.getElementById('gridSize').addEventListener('change', renderWafq);
    document.getElementById('targetSum').addEventListener('input', renderWafq);

    const params = new URLSearchParams(window.location.search);
    const paramSum = parseInt(params.get('sum'), 10);
    if (Number.isFinite(paramSum) && paramSum > 0) {
      document.getElementById('targetSum').value = String(paramSum);
    }

    renderWafq();
  </script>
</body>
</html>
