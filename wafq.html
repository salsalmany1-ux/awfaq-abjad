<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الاوفاق</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #121722;
      --surface-2: #182030;
      --gold: #d4af37;
      --gold-bright: #f0cf65;
      --gold-soft: rgba(212, 175, 55, 0.14);
      --gold-border: rgba(212, 175, 55, 0.35);
      --text: #f3f5f8;
      --muted: #9aa5b8;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #171f30 0%, var(--bg) 62%);
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      line-height: 1.7;
      min-height: 100vh;
      padding: 24px 16px 70px;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-link {
      text-decoration: none;
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 7px 14px;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .nav-link.active, .nav-link:hover {
      color: var(--gold-bright);
      border-color: var(--gold-border);
      background: var(--gold-soft);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      padding: 22px 18px;
      background: linear-gradient(180deg, rgba(212,175,55,0.09), rgba(18,23,34,0.68));
      border: 1px solid var(--gold-border);
      border-radius: var(--radius);
    }

    header h1 {
      font-family: 'Amiri', serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: var(--gold);
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 14px 35px rgba(0,0,0,0.3);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    .field {
      flex: 1 1 200px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="number"], select {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
      font-family: inherit;
      font-size: 0.96rem;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--gold);
    }

    .mode-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
      align-items: center;
    }

    .btn {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 11px 20px;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-mode {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .btn-mode.active {
      background: var(--gold-soft);
      color: var(--gold-bright);
      border-color: var(--gold);
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .summary-box {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .summary-box .k { font-size: 0.85rem; color: var(--muted); }
    .summary-box .v {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--gold-bright);
      margin-top: 4px;
    }

    .wafq-wrapper {
      overflow-x: auto;
      padding: 10px 0;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-hint {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .wafq-grid {
      display: grid;
      gap: 8px;
      margin: 0 auto;
      width: fit-content;
    }

    .wafq-cell {
      min-width: 90px;
      min-height: 76px;
      padding: 8px 6px;
      background: var(--surface-2);
      border: 1px solid var(--gold-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      font-size: 1.02rem;
      color: var(--text);
    }

    .wafq-cell.center-cell {
      background: var(--gold-soft);
      border-color: var(--gold-bright);
      color: var(--gold-bright);
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav-bar">
      <div class="nav-links">
        <a href="index.html" class="nav-link">حاسبة الجُمّل والطبائع</a>
        <a href="wafq.html" class="nav-link active">الاوفاق</a>
      </div>
    </nav>

    <header>
      <h1>الاوفاق</h1>
    </header>

    <section class="card">
      <div class="controls-row">
        <div class="field">
          <label for="targetSum">الرقم المستهدف (المجموع)</label>
          <input type="number" id="targetSum" min="1" step="1" placeholder="أدخل رقماً..." />
        </div>
        <div class="field">
          <label for="gridSize">مرتبة الوفق</label>
          <select id="gridSize">
            <option value="3">3 × 3</option>
            <option value="4">4 × 4</option>
            <option value="5">5 × 5</option>
            <option value="6">6 × 6</option>
            <option value="7">7 × 7</option>
            <option value="8">8 × 8</option>
            <option value="9">9 × 9</option>
            <option value="10">10 × 10</option>
          </select>
        </div>
      </div>

      <div class="mode-btns">
        <button class="btn" id="generateBtn">توليد</button>
        <button class="btn btn-mode active" id="btnNumeric" data-mode="numeric">وفق رقمي</button>
        <button class="btn btn-mode" id="btnWithAl" data-mode="withAl">وفق اسمي (بالـ التعريف)</button>
        <button class="btn btn-mode" id="btnWithoutAl" data-mode="withoutAl">وفق اسمي (بدون الـ التعريف)</button>
      </div>

      <div class="summary-strip">
        <div class="summary-box">
          <div class="k">المرتبة</div>
          <div class="v" id="metaSize">—</div>
        </div>
        <div class="summary-box">
          <div class="k">المجموع</div>
          <div class="v" id="metaSum">—</div>
        </div>
        <div class="summary-box">
          <div class="k">النمط الحالي</div>
          <div class="v" id="metaMode">وفق رقمي</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="wafq-wrapper" id="wafqOutput">
        <div class="empty-hint">اختر البيانات واضغط «توليد»</div>
      </div>
    </section>
  </div>

  <script>
    const ABJAD_VALUES = {
      'ا': 1, 'أ': 1, 'إ': 1, 'آ': 1, 'ى': 1, 'ء': 1,
      'ب': 2, 'ج': 3, 'د': 4, 'ه': 5, 'ة': 5, 'و': 6, 'ؤ': 6,
      'ز': 7, 'ح': 8, 'ط': 9, 'ي': 10, 'ئ': 10, 'ك': 20, 'ل': 30,
      'م': 40, 'ن': 50, 'س': 60, 'ع': 70, 'ف': 80, 'ص': 90,
      'ق': 100, 'ر': 200, 'ش': 300, 'ت': 400, 'ث': 500, 'خ': 600,
      'ذ': 700, 'ض': 800, 'ظ': 900, 'غ': 1000
    };

    const ASMA_WITH_AL = [
      'الله', 'الرحمن', 'الرحيم', 'الملك', 'القدوس', 'السلام', 'المؤمن', 'المهيمن', 'العزيز', 'الجبار',
      'المتكبر', 'الخالق', 'البارئ', 'المصور', 'الغفار', 'القهار', 'الوهاب', 'الرزاق', 'الفتاح', 'العليم',
      'القابض', 'الباسط', 'الخافض', 'الرافع', 'المعز', 'المذل', 'السميع', 'البصير', 'الحكم', 'العدل',
      'اللطيف', 'الخبير', 'الحليم', 'العظيم', 'الغفور', 'الشكور', 'العلي', 'الكبير', 'الحفيظ', 'المقيت',
      'الحسيب', 'الجليل', 'الكريم', 'الرقيب', 'المجيب', 'الواسع', 'الحكيم', 'الودود', 'المجيد', 'الباعث',
      'الشهيد', 'الحق', 'الوكيل', 'القوي', 'المتين', 'الولي', 'الحميد', 'المحصي', 'المبدئ', 'المعيد',
      'المحيي', 'المميت', 'الحي', 'القيوم', 'الواجد', 'الماجد', 'الواحد', 'الأحد', 'الصمد', 'القادر',
      'المقتدر', 'المقدم', 'المؤخر', 'الأول', 'الآخر', 'الظاهر', 'الباطن', 'الوالي', 'المتعالي', 'البر',
      'التواب', 'المنتقم', 'العفو', 'الرؤوف', 'مالك الملك', 'ذو الجلال والإكرام', 'المقسط', 'الجامع', 'الغني', 'المغني',
      'المانع', 'الضار', 'النافع', 'النور', 'الهادي', 'البديع', 'الباقي', 'الوارث', 'الرشيد', 'الصبور'
    ];

    function stripAl(name) {
      return name
        .split(' ')
        .map(word => word.startsWith('ال') ? word.slice(2) : word)
        .join(' ');
    }

    function calcAbjad(text) {
      let total = 0;
      for (const ch of text) {
        if (ABJAD_VALUES[ch]) total += ABJAD_VALUES[ch];
      }
      return total;
    }

    const ASMA_WITH_AL_LIST = ASMA_WITH_AL.map(name => ({
      display: name,
      value: calcAbjad(name)
    }));

    const ASMA_WITHOUT_AL_LIST = ASMA_WITH_AL.map(name => {
      const stripped = stripAl(name);
      return {
        display: stripped,
        value: calcAbjad(stripped)
      };
    });

    let currentMode = 'numeric';
    let lastGeneratedState = null;

    function getUnitOrderMatrix(n) {
      const total = n * n;
      const m = Array.from({ length: n }, () => Array(n).fill(0));

      if (n % 2 === 1) {
        let r = 0;
        let c = Math.floor(n / 2);
        for (let k = 1; k <= total; k++) {
          m[r][c] = k;
          const nr = (r - 1 + n) % n;
          const nc = (c + 1) % n;
          if (m[nr][nc] !== 0) {
            r = (r + 1) % n;
          } else {
            r = nr;
            c = nc;
          }
        }
        return m;
      }

      if (n % 4 === 0) {
        let idx = 1;
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            m[r][c] = idx++;
          }
        }
        for (let r = 0; r < n; r++) {
          for (let c = 0; c < n; c++) {
            if ((r % 4 === c % 4) || ((r % 4) + (c % 4) === 3)) {
              m[r][c] = (total + 1) - m[r][c];
            }
          }
        }
        return m;
      }

      const half = n / 2;
      const subSize = half * half;
      const subOrder = getUnitOrderMatrix(half);
      const quadrantOffsets = [
        { rOff: 0, cOff: 0, add: 0 },
        { rOff: half, cOff: half, add: subSize },
        { rOff: 0, cOff: half, add: 2 * subSize },
        { rOff: half, cOff: 0, add: 3 * subSize }
      ];

      for (const q of quadrantOffsets) {
        for (let r = 0; r < half; r++) {
          for (let c = 0; c < half; c++) {
            m[r + q.rOff][c + q.cOff] = subOrder[r][c] + q.add;
          }
        }
      }

      const k = (n - 2) / 4;
      for (let r = 0; r < half; r++) {
        for (let c = 0; c < k; c++) {
          const actualC = (r === Math.floor(half / 2)) ? c + 1 : c;
          const tmp = m[r][actualC];
          m[r][actualC] = m[r + half][actualC];
          m[r + half][actualC] = tmp;
        }
      }
      for (let r = 0; r < half; r++) {
        for (let c = 0; c < k - 1; c++) {
          const col = n - 1 - c;
          const tmp = m[r][col];
          m[r][col] = m[r + half][col];
          m[r + half][col] = tmp;
        }
      }

      return m;
    }

    function buildIntegerMagicMatrix(n, targetSum) {
      const total = n * n;
      const base = getUnitOrderMatrix(n);
      const avgUnitSum = (total + 1) / 2;

      let step = 1;
      const rawKey = (targetSum - (n - 1) * avgUnitSum) / n;
      let key = Math.floor(rawKey);
      if (key < 1) key = 1;

      const remainder = targetSum - (n * key + (n - 1) * avgUnitSum * step);
      const extraPerCell = Math.round(remainder / (n * avgUnitSum));
      if (extraPerCell !== 0) {
        step = Math.max(1, step + extraPerCell);
        key = Math.max(1, Math.floor((targetSum - (n - 1) * avgUnitSum * step) / n));
      }

      const matrix = Array.from({ length: n }, () => Array(n).fill(0));
      const used = new Set();

      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          let val = Math.round(key + (base[r][c] - 1) * step);
          if (val < 1) val = 1;
          while (used.has(val)) {
            val += 1;
          }
          used.add(val);
          matrix[r][c] = val;
        }
      }

      return matrix;
    }

    function getTraversalOrderFromCenter(n) {
      const order = [];
      const visited = Array.from({ length: n }, () => Array(n).fill(false));
      const startR = Math.floor((n - 1) / 2);
      const startC = Math.floor((n - 1) / 2);

      order.push({ r: startR, c: startC });
      visited[startR][startC] = true;

      let r = startR;
      let c = startC;
      let step = 1;
      const dirs = [
        [0, 1],
        [1, 0],
        [0, -1],
        [-1, 0]
      ];
      let dirIdx = 0;

      while (order.length < n * n) {
        for (let rep = 0; rep < 2; rep++) {
          const [dr, dc] = dirs[dirIdx % 4];
          for (let s = 0; s < step; s++) {
            r += dr;
            c += dc;
            if (r >= 0 && r < n && c >= 0 && c < n && !visited[r][c]) {
              order.push({ r, c });
              visited[r][c] = true;
            }
          }
          dirIdx++;
        }
        step++;
      }

      return order;
    }

    function findNameMatchByTens(cellValue, namesList, usedNames) {
      if (!Number.isSafeInteger(cellValue) || cellValue <= 0) return null;

      const MAX_EXP = 9;
      const cellScaled = [];
      for (let k = 0; k <= MAX_EXP; k++) {
        const v = cellValue * Math.pow(10, k);
        if (!Number.isSafeInteger(v)) break;
        cellScaled.push(v);
      }

      for (const candidate of namesList) {
        if (!candidate.value || candidate.value <= 0) continue;
        if (usedNames.has(candidate.display)) continue;

        for (let m = 0; m <= MAX_EXP; m++) {
          const nameVal = candidate.value * Math.pow(10, m);
          if (!Number.isSafeInteger(nameVal)) break;

          for (const cVal of cellScaled) {
            if (cVal === nameVal) {
              return candidate.display;
            }
          }
        }
      }

      return null;
    }

    function renderFromState(state) {
      if (!state) return;
      const { n, targetSum, matrix } = state;

      const modeNames = {
        numeric: 'وفق رقمي',
        withAl: 'وفق اسمي (بالـ التعريف)',
        withoutAl: 'وفق اسمي (بدون الـ التعريف)'
      };

      document.getElementById('metaSize').textContent = `${n} × ${n}`;
      document.getElementById('metaSum').textContent = targetSum.toLocaleString('ar');
      document.getElementById('metaMode').textContent = modeNames[currentMode];

      const traversal = getTraversalOrderFromCenter(n);
      const displayGrid = Array.from({ length: n }, () => Array(n).fill(''));
      const usedNames = new Set();
      const activeNames = currentMode === 'withAl' ? ASMA_WITH_AL_LIST : ASMA_WITHOUT_AL_LIST;

      for (const { r, c } of traversal) {
        const val = matrix[r][c];
        if (currentMode === 'numeric') {
          displayGrid[r][c] = val.toLocaleString('ar');
        } else {
          const matched = findNameMatchByTens(val, activeNames, usedNames);
          if (matched) {
            usedNames.add(matched);
            displayGrid[r][c] = matched;
          } else {
            displayGrid[r][c] = val.toLocaleString('ar');
          }
        }
      }

      const gridEl = document.createElement('div');
      gridEl.className = 'wafq-grid';
      gridEl.style.gridTemplateColumns = `repeat(${n}, minmax(90px, 1fr))`;

      const centerR = Math.floor((n - 1) / 2);
      const centerC = Math.floor((n - 1) / 2);

      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const cell = document.createElement('div');
          const isCenter = (r === centerR && c === centerC);
          cell.className = 'wafq-cell' + (isCenter ? ' center-cell' : '');
          cell.textContent = displayGrid[r][c];
          gridEl.appendChild(cell);
        }
      }

      const out = document.getElementById('wafqOutput');
      out.innerHTML = '';
      out.appendChild(gridEl);
    }

    function generateWafq() {
      const n = parseInt(document.getElementById('gridSize').value, 10);
      const rawSum = parseInt(document.getElementById('targetSum').value, 10);
      const defaultSum = (n * (n * n + 1)) / 2;
      const targetSum = Number.isFinite(rawSum) && rawSum > 0 ? rawSum : defaultSum;

      const matrix = buildIntegerMagicMatrix(n, targetSum);
      lastGeneratedState = { n, targetSum, matrix };
      renderFromState(lastGeneratedState);
    }

    document.querySelectorAll('.btn-mode').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        if (lastGeneratedState) {
          renderFromState(lastGeneratedState);
        } else {
          const modeNames = {
            numeric: 'وفق رقمي',
            withAl: 'وفق اسمي (بالـ التعريف)',
            withoutAl: 'وفق اسمي (بدون الـ التعريف)'
          };
          document.getElementById('metaMode').textContent = modeNames[currentMode];
        }
      });
    });

    document.getElementById('generateBtn').addEventListener('click', generateWafq);

    const params = new URLSearchParams(window.location.search);
    const paramSum = parseInt(params.get('sum'), 10);
    if (Number.isFinite(paramSum) && paramSum > 0) {
      document.getElementById('targetSum').value = String(paramSum);
    }
  </script>
</body>
</html>
