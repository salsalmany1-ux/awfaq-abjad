<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حاسبة الجُمّل والحروف والأبراج</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #131823;
      --card-2: #192030;
      --text: #f3f5f8;
      --muted: #9aa4b8;
      --accent: #ff6a00;
      --accent-2: #ff9447;
      --border: rgba(255, 255, 255, 0.09);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at top, #181f2e 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 60px;
      line-height: 1.6;
    }

    .points-hud {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 999;
      background: rgba(19, 24, 35, 0.94);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 106, 0, 0.45);
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      max-width: 290px;
    }

    .points-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .points-badge {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--accent-2);
    }

    .ad-quick-btn {
      background: var(--accent);
      color: #0b0e14;
      border: none;
      border-radius: 9px;
      padding: 6px 10px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .ad-quick-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .status-bar {
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 6px;
    }

    .page-shell {
      max-width: 1280px;
      margin: 56px auto 0;
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr) 160px;
      gap: 18px;
      align-items: start;
    }

    .side-ads {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .banner-slot {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 14px auto;
      max-width: 100%;
      overflow-x: auto;
    }

    .banner-slot iframe {
      border: 0;
      background: transparent;
      display: block;
    }

    .desktop-only-banner { display: flex; }
    .mobile-only-banner { display: none; }

    @media (max-width: 1024px) {
      .page-shell {
        grid-template-columns: minmax(0, 1fr);
      }
      .side-ads {
        display: none;
      }
    }

    @media (max-width: 760px) {
      .desktop-only-banner { display: none; }
      .mobile-only-banner { display: flex; }
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      color: #fff;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .nav-btn {
      text-decoration: none;
      color: var(--text);
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .nav-btn.primary {
      background: var(--accent);
      color: #0b0e14;
      border-color: transparent;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--accent-2);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #d7dde8;
    }

    input[type="text"],
    select {
      width: 100%;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 0.95rem;
    }

    .radio-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .radio-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text);
    }

    .radio-pill input {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn {
      background: var(--accent);
      color: #0b0e14;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.92rem;
    }

    .btn.secondary {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .actions-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .result-box {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
    }

    .details-grid {
      display: grid;
      gap: 8px;
      font-size: 0.94rem;
    }

    .details-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
    }

    .bars {
      margin-top: 10px;
      display: grid;
      gap: 8px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 75px 1fr 52px;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
    }

    .bar-track {
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 999px;
    }

    .toast {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      display: none;
    }

    .toast.ok {
      display: block;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    .toast.err {
      display: block;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .muted-note {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>

    <div class="points-top">

  <div class="page-shell">
    <aside class="side-ads" aria-label="إعلانات جانبية">
      <div class="banner-slot" data-ad-key="2c097ab44a64c6c0606b2fb1836488bd" data-ad-w="160" data-ad-h="600"></div>

    <main class="container">
      <header>
        <h1>حاسبة الجُمّل والحروف والأبراج</h1>
        <p class="subtitle">حساب الجُمّل بالأبجدية، تحليل نسب طبائع الحروف، واستخراج الأبراج الفلكية والصينية والشهرية</p>
        <div class="nav-links">

  <script>
    const SMART_LINK_URL = "https://asiafilm.org/4/56aaa9153709df41930060678aa64610";
    const AD_SCRIPT_BASE = "https://bicea.org/22";
    const STORAGE_KEY = "abjad_wafq_points_state_v1";
    const REF_CLAIMED_KEY = "abjad_wafq_ref_claimed_v1";

    function mountIsolatedBanners() {
      document.querySelectorAll(".banner-slot[data-ad-key]").forEach((slot) => {
        const key = slot.getAttribute("data-ad-key");
        const w = parseInt(slot.getAttribute("data-ad-w"), 10);
        const h = parseInt(slot.getAttribute("data-ad-h"), 10);
        if (!key || !w || !h) return;

        const iframe = document.createElement("iframe");
        iframe.width = String(w);
        iframe.height = String(h);
        iframe.style.width = `${w}px`;
        iframe.style.height = `${h}px`;
        iframe.style.border = "0";
        iframe.style.overflow = "hidden";
        iframe.loading = "lazy";
        iframe.scrolling = "no";

        slot.innerHTML = "";
        slot.appendChild(iframe);

        const doc = iframe.contentDocument || iframe.contentWindow?.document;
        if (doc) {
          doc.open();
          doc.write(`<!DOCTYPE html><html><head><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;}</style></head><body>
            <script>
              atOptions = {
                'key' : '${key}',
                'format' : 'iframe',
                'height' : ${h},
                'width' : ${w},
                'params' : {}
              };
            <\/script>
            <script data-cfasync="false" src="${AD_SCRIPT_BASE}/${key}"><\/script>
          </body></html>`);
          doc.close();
        }
      });
    }

    const CONFIG = {
      WELCOME_BONUS: 25,
      AD_REWARD: 10,
      TASK_COST: 10,
      SHARE_REWARD: 40,
      REFERRAL_REWARD: 50,
      AD_COOLDOWN_SECONDS: 12,
      MAX_ADS_PER_HOUR: 12,
      MAX_ADS_PER_DAY: 40,
      WEEKLY_DAILY_REWARDS: [5, 10, 15, 20, 25, 30, 40]
    };

    const ABJAD_MAP = {
      "أ": 1, "ا": 1, "إ": 1, "آ": 1,
      "ب": 2, "ج": 3, "د": 4,
      "ه": 5, "ة": 5, "و": 6, "ز": 7, "ح": 8, "ط": 9,
      "ي": 10, "ى": 10, "ك": 20, "ل": 30, "م": 40, "ن": 50,
      "س": 60, "ع": 70, "ف": 80, "ص": 90,
      "ق": 100, "ر": 200, "ش": 300, "ت": 400, "ث": 500,
      "خ": 600, "ذ": 700, "ض": 800, "ظ": 900, "غ": 1000
    };

    const LETTER_ELEMENT = {
      "أ": "ناري", "ا": "ناري", "إ": "ناري", "آ": "ناري",
      "ه": "ناري", "ة": "ناري",
      "ط": "ناري", "م": "ناري", "ف": "ناري", "ش": "ناري", "ذ": "ناري",
      "ب": "ترابي", "و": "ترابي", "ي": "ترابي", "ى": "ترابي",
      "ن": "ترابي", "ص": "ترابي", "ت": "ترابي", "ض": "ترابي",
      "ج": "هوائي", "ز": "هوائي", "ك": "هوائي", "س": "هوائي",
      "ق": "هوائي", "ث": "هوائي", "ظ": "هوائي",
      "د": "مائي", "ح": "مائي", "ل": "مائي", "ع": "مائي",
      "ر": "مائي", "خ": "مائي", "غ": "مائي"
    };

    const ASTRO_ZODIAC = [
      { name: "الحمل", element: "ناري", start: [3, 21], end: [4, 19] },
      { name: "الثور", element: "ترابي", start: [4, 20], end: [5, 20] },
      { name: "الجوزاء", element: "هوائي", start: [5, 21], end: [6, 20] },
      { name: "السرطان", element: "مائي", start: [6, 21], end: [7, 22] },
      { name: "الأسد", element: "ناري", start: [7, 23], end: [8, 22] },
      { name: "العذراء", element: "ترابي", start: [8, 23], end: [9, 22] },
      { name: "الميزان", element: "هوائي", start: [9, 23], end: [10, 22] },
      { name: "العقرب", element: "مائي", start: [10, 23], end: [11, 21] },
      { name: "القوس", element: "ناري", start: [11, 22], end: [12, 21] },
      { name: "الجدي", element: "ترابي", start: [12, 22], end: [1, 19] },
      { name: "الدلو", element: "هوائي", start: [1, 20], end: [2, 18] },
      { name: "الحوت", element: "مائي", start: [2, 19], end: [3, 20] }
    ];

    const CHINESE_ANIMALS = [
      "الفأر", "الثور", "النمر", "الأرنب", "التنين", "الأفعى",
      "الحصان", "الماعز", "القرد", "الديك", "الكلب", "الخنزير"
    ];

    const CHINESE_ELEMENTS = ["خشب", "نار", "أرض", "معدن", "ماء"];

    const MONTHLY_ZODIAC = {
      1: "الجدي / الدلو",
      2: "الدلو / الحوت",
      3: "الحوت / الحمل",
      4: "الحمل / الثور",
      5: "الثور / الجوزاء",
      6: "الجوزاء / السرطان",
      7: "السرطان / الأسد",
      8: "الأسد / العذراء",
      9: "العذراء / الميزان",
      10: "الميزان / العقرب",
      11: "العقرب / القوس",
      12: "القوس / الجدي"
    };

    function populateBirthSelects() {
      const daySel = document.getElementById("birthDaySelect");
      const yearSel = document.getElementById("birthYearSelect");

      daySel.innerHTML = `<option value="">اختر اليوم</option>`;
      for (let d = 1; d <= 31; d++) {
        daySel.innerHTML += `<option value="${d}">${d}</option>`;
      }

      const currentYear = new Date().getFullYear();
      yearSel.innerHTML = `<option value="">اختر السنة</option>`;
      for (let y = currentYear; y >= 1920; y--) {
        yearSel.innerHTML += `<option value="${y}">${y}</option>`;
      }
    }

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function generateRefCode() {
      return "REF-" + Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function getDefaultState() {
      return {
        points: CONFIG.WELCOME_BONUS,
        refCode: generateRefCode(),
        invitedCount: 0,
        lastResultSummary: "",
        lastCalculatedSum: null,
        lastShareDate: "",
        adTimestamps: [],
        daily: {
          streakDay: 0,
          lastClaimDate: ""
        }
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const fresh = getDefaultState();
          saveState(fresh);
          return fresh;
        }
        const parsed = JSON.parse(raw);
        return {
          ...getDefaultState(),
          ...parsed,
          daily: {
            ...getDefaultState().daily,
            ...(parsed.daily || {})
          },
          adTimestamps: Array.isArray(parsed.adTimestamps) ? parsed.adTimestamps : []
        };
      } catch {
        return getDefaultState();
      }
    }

    function saveState(s) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
    }

    let state = loadState();
    let adCooldownTimer = null;
    let adRemainingSeconds = 0;

    function showToast(msg, type = "ok") {
      const el = document.getElementById("systemToast");
      el.textContent = msg;
      el.className = `toast ${type}`;
    }

    function pruneAdTimestamps() {
      const oneDayAgo = Date.now() - 24 * 60 * 60 * 1000;
      state.adTimestamps = state.adTimestamps.filter((ts) => ts >= oneDayAgo);
    }

    function getAdCounts() {
      pruneAdTimestamps();
      const now = Date.now();
      const oneHourAgo = now - 60 * 60 * 1000;
      return {
        lastHour: state.adTimestamps.filter((ts) => ts >= oneHourAgo).length,
        last24h: state.adTimestamps.length
      };
    }

    function getNextDailyRewardInfo() {
      const today = getTodayKey();
      const alreadyClaimedToday = state.daily.lastClaimDate === today;
      const nextIndex = state.daily.streakDay >= 7 ? 0 : state.daily.streakDay;
      const reward = CONFIG.WEEKLY_DAILY_REWARDS[nextIndex];
      const dayNumber = nextIndex + 1;
      return { alreadyClaimedToday, reward, dayNumber };
    }

    function renderHUD() {
      pruneAdTimestamps();
      saveState(state);

      document.getElementById("pointsDisplay").textContent = `النقاط: ${state.points}`;

      const { lastHour, last24h } = getAdCounts();
      const watchBtn = document.getElementById("watchAdBtn");

      if (adRemainingSeconds > 0) {
        watchBtn.disabled = true;
        watchBtn.textContent = `انتظر ${adRemainingSeconds}ث`;
      } else if (lastHour >= CONFIG.MAX_ADS_PER_HOUR || last24h >= CONFIG.MAX_ADS_PER_DAY) {
        watchBtn.disabled = true;
        watchBtn.textContent = "حد الإعلانات";
      } else {
        watchBtn.disabled = false;
        watchBtn.textContent = `+${CONFIG.AD_REWARD} إعلان`;
      }

      const dailyInfo = getNextDailyRewardInfo();
      const dailyBtn = document.getElementById("dailyBonusBtn");
      if (dailyInfo.alreadyClaimedToday) {
        dailyBtn.disabled = true;
        dailyBtn.textContent = `تم استلام اليوم (${state.daily.streakDay}/7)`;
      } else {
        dailyBtn.disabled = false;
        dailyBtn.textContent = `دخول يومي (+${dailyInfo.reward} نقطة)`;
      }

      document.getElementById("dailyCycleInfo").textContent =
        `مكافأة الدخول اليومي: اليوم ${dailyInfo.dayNumber} من 7 بقيمة +${dailyInfo.reward} نقطة | المدعوون: ${state.invitedCount}`;

      document.getElementById("statusBar").textContent =
        `إعلانات الساعة: ${lastHour}/${CONFIG.MAX_ADS_PER_HOUR} • اليوم: ${last24h}/${CONFIG.MAX_ADS_PER_DAY}`;

      const openWafqBtn = document.getElementById("openWafqFromSumBtn");
      openWafqBtn.disabled = !(typeof state.lastCalculatedSum === "number" && state.lastCalculatedSum > 0);
    }

    function handleIncomingReferral() {
      const params = new URLSearchParams(window.location.search);
      const ref = (params.get("ref") || "").trim();
      if (!ref || ref === state.refCode || localStorage.getItem(REF_CLAIMED_KEY)) return;
      localStorage.setItem(REF_CLAIMED_KEY, ref);
      state.points += CONFIG.REFERRAL_REWARD;
      state.invitedCount += 1;
      saveState(state);
      showToast(`تم تفعيل دعوة الصديق وحصلت على +${CONFIG.REFERRAL_REWARD} نقطة!`, "ok");
    }

    function handleWatchAd() {
      const { lastHour, last24h } = getAdCounts();
      if (lastHour >= CONFIG.MAX_ADS_PER_HOUR) {
        showToast(`بلغت الحد الأقصى للإعلانات في الساعة (${CONFIG.MAX_ADS_PER_HOUR}).`, "err");
        renderHUD();
        return;
      }
      if (last24h >= CONFIG.MAX_ADS_PER_DAY) {
        showToast(`بلغت الحد الأقصى للإعلانات اليومي (${CONFIG.MAX_ADS_PER_DAY}).`, "err");
        renderHUD();
        return;
      }
      if (adRemainingSeconds > 0) return;

      window.open(SMART_LINK_URL, "_blank", "noopener,noreferrer");
      adRemainingSeconds = CONFIG.AD_COOLDOWN_SECONDS;
      renderHUD();

      clearInterval(adCooldownTimer);
      adCooldownTimer = setInterval(() => {
        adRemainingSeconds -= 1;
        if (adRemainingSeconds <= 0) {
          clearInterval(adCooldownTimer);
          adRemainingSeconds = 0;
          state.points += CONFIG.AD_REWARD;
          state.adTimestamps.push(Date.now());
          saveState(state);
          showToast(`تمت إضافة +${CONFIG.AD_REWARD} نقطة بعد إتمام الإعلان.`, "ok");
          renderHUD();
        } else {
          renderHUD();
        }
      }, 1000);
    }

    function handleDailyBonus() {
      const info = getNextDailyRewardInfo();
      if (info.alreadyClaimedToday) {
        showToast("لقد استلمت مكافأة اليوم بالفعل.", "err");
        return;
      }
      state.daily.streakDay = state.daily.streakDay >= 7 ? 1 : state.daily.streakDay + 1;
      state.daily.lastClaimDate = getTodayKey();
      state.points += info.reward;
      saveState(state);
      showToast(`مبروك! حصلت على +${info.reward} نقطة (اليوم ${state.daily.streakDay}).`, "ok");
      renderHUD();
    }

    async function handleShareResult() {
      const today = getTodayKey();
      if (state.lastShareDate === today) {
        showToast("لقد حصلت على مكافأة المشاركة لليوم (+40 نقطة).", "err");
        return;
      }
      const textToShare = state.lastResultSummary
        ? `${state.lastResultSummary} — عبر حاسبة الجُمّل والأوفاق`
        : "جرّب حاسبة الجُمّل والأبراج ومولّد الأوفاق الآن!";
      try {
        if (navigator.share) {
          await navigator.share({ title: "حاسبة الجُمّل والأوفاق", text: textToShare, url: window.location.href });
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(`${textToShare} ${window.location.href}`);
        }
      } catch {
        showToast("لم تكتمل عملية المشاركة.", "err");
        return;
      }
      state.lastShareDate = today;
      state.points += CONFIG.SHARE_REWARD;
      saveState(state);
      showToast(`تمت المشاركة وحصلت على +${CONFIG.SHARE_REWARD} نقطة!`, "ok");
      renderHUD();
    }

    async function handleCopyInvite() {
      const inviteUrl = `${window.location.origin}${window.location.pathname}?ref=${encodeURIComponent(state.refCode)}`;
      try {
        await navigator.clipboard.writeText(inviteUrl);
      } catch {
        prompt("انسخ رابط الدعوة:", inviteUrl);
      }
      showToast(`تم نسخ رابط الدعوة! ستحصل على +${CONFIG.REFERRAL_REWARD} نقطة لكل صديق جديد.`, "ok");
    }

    function spendTaskPoints() {
      if (state.points < CONFIG.TASK_COST) {
        showToast(`رصيدك الحالي (${state.points}) أقل من تكلفة المهمة (${CONFIG.TASK_COST} نقاط).`, "err");
        return false;
      }
      state.points -= CONFIG.TASK_COST;
      saveState(state);
      renderHUD();
      return true;
    }

    function calculateAbjad() {
      const raw = document.getElementById("abjadInput").value || "";
      const letters = [];
      let total = 0;
      const elementCounts = { "ناري": 0, "ترابي": 0, "هوائي": 0, "مائي": 0 };

      for (const ch of raw) {
        if (Object.prototype.hasOwnProperty.call(ABJAD_MAP, ch)) {
          letters.push(ch);
          total += ABJAD_MAP[ch];
          const el = LETTER_ELEMENT[ch] || "ترابي";
          elementCounts[el] += 1;
        }
      }

      if (letters.length === 0) {
        showToast("يرجى إدخال حروف عربية صالحة للحساب.", "err");
        return;
      }

      if (!spendTaskPoints()) return;

      const count = letters.length;
      const pct = (k) => Math.round((elementCounts[k] / count) * 100);
      const firePct = pct("ناري");
      const earthPct = pct("ترابي");
      const airPct = pct("هوائي");
      const waterPct = pct("مائي");

      state.lastCalculatedSum = total;
      state.lastResultSummary = `حساب الجُمّل لـ "${raw.trim()}" = ${total} (عدد الحروف: ${count})`;
      saveState(state);
      renderHUD();

      document.getElementById("abjadOutput").innerHTML = `
        <div class="result-box">
          <div>المجموع الأبجدي (حساب الجُمّل):</div>
          <div style="font-size:1.7rem;font-weight:800;color:var(--accent-2);">${total}</div>
          <div class="muted-note">عدد الحروف المحتسبة: ${count}</div>

          <div class="bars">
            <div class="bar-row">
              <span>ناري</span>
              <div class="bar-track"><div class="bar-fill" style="width:${firePct}%"></div></div>
              <span>${firePct}%</span>
            </div>
            <div class="bar-row">
              <span>ترابي</span>
              <div class="bar-track"><div class="bar-fill" style="width:${earthPct}%"></div></div>
              <span>${earthPct}%</span>
            </div>
            <div class="bar-row">
              <span>هوائي</span>
              <div class="bar-track"><div class="bar-fill" style="width:${airPct}%"></div></div>
              <span>${airPct}%</span>
            </div>
            <div class="bar-row">
              <span>مائي</span>
              <div class="bar-track"><div class="bar-fill" style="width:${waterPct}%"></div></div>
              <span>${waterPct}%</span>
            </div>
          </div>
        </div>
      `;
      showToast(`تم تنفيذ الحساب وخصم ${CONFIG.TASK_COST} نقاط.`, "ok");
    }

    function getAstroZodiac(month, day) {
      const inRange = (m, d, start, end) => {
        const [sm, sd] = start;
        const [em, ed] = end;
        if (sm <= em) {
          return (m > sm || (m === sm && d >= sd)) && (m < em || (m === em && d <= ed));
        }
        return (m > sm || (m === sm && d >= sd)) || (m < em || (m === em && d <= ed));
      };
      return ASTRO_ZODIAC.find((z) => inRange(month, day, z.start, z.end)) || ASTRO_ZODIAC[0];
    }

    function getChineseZodiac(year) {
      const animalIndex = ((year - 4) % 12 + 12) % 12;
      const elementIndex = Math.floor((((year - 4) % 10 + 10) % 10) / 2);
      return {
        animal: CHINESE_ANIMALS[animalIndex],
        element: CHINESE_ELEMENTS[elementIndex]
      };
    }

    function getSelectedZodiacMode() {
      const checked = document.querySelector('input[name="zodiacMode"]:checked');
      return checked ? checked.value : "all";
    }

    function calculateZodiac() {
      const day = parseInt(document.getElementById("birthDaySelect").value, 10);
      const month = parseInt(document.getElementById("birthMonthSelect").value, 10);
      const year = parseInt(document.getElementById("birthYearSelect").value, 10);

      if (!day || !month || !year) {
        showToast("يرجى اختيار اليوم والشهر والسنة من القوائم المنسدلة.", "err");
        return;
      }

      if (!spendTaskPoints()) return;

      const astro = getAstroZodiac(month, day);
      const chinese = getChineseZodiac(year);
      const monthly = MONTHLY_ZODIAC[month] || "";
      const mode = getSelectedZodiacMode();

      const astroHtml = `<div class="details-item"><strong>البرج الفلكي:</strong> ${astro.name} (${astro.element})</div>`;
      const chineseHtml = `<div class="details-item"><strong>البرج الصيني:</strong> ${chinese.animal} (${chinese.element})</div>`;
      const monthlyHtml = `<div class="details-item"><strong>البرج الشهري:</strong> ${monthly}</div>`;

      let renderedItems = "";
      let summaryText = "";

      if (mode === "astro") {
        renderedItems = astroHtml;
        summaryText = `البرج الفلكي: ${astro.name} (${astro.element})`;
      } else if (mode === "chinese") {
        renderedItems = chineseHtml;
        summaryText = `البرج الصيني: ${chinese.animal} (${chinese.element})`;
      } else if (mode === "monthly") {
        renderedItems = monthlyHtml;
        summaryText = `البرج الشهري: ${monthly}`;
      } else {
        renderedItems = `${astroHtml}${chineseHtml}${monthlyHtml}`;
        summaryText = `الفلكي: ${astro.name} • الصيني: ${chinese.animal} • الشهري: ${monthly}`;
      }

      state.lastResultSummary = summaryText;
      saveState(state);

      document.getElementById("zodiacOutput").innerHTML = `
        <div class="result-box">
          <div class="details-grid">${renderedItems}</div>
        </div>
      `;

      showToast(`تم استخراج البرج وخصم ${CONFIG.TASK_COST} نقاط.`, "ok");
    }

    mountIsolatedBanners();
    populateBirthSelects();
    document.getElementById("watchAdBtn").addEventListener("click", handleWatchAd);
    document.getElementById("dailyBonusBtn").addEventListener("click", handleDailyBonus);
    document.getElementById("shareResultBtn").addEventListener("click", handleShareResult);
    document.getElementById("copyInviteBtn").addEventListener("click", handleCopyInvite);
    document.getElementById("calcAbjadBtn").addEventListener("click", calculateAbjad);
    document.getElementById("calcZodiacBtn").addEventListener("click", calculateZodiac);
    document.getElementById("openWafqFromSumBtn").addEventListener("click", () => {
      if (typeof state.lastCalculatedSum === "number" && state.lastCalculatedSum > 0) {
        window.location.href = `wafq.html?sum=${encodeURIComponent(state.lastCalculatedSum)}`;
      }
    });

    handleIncomingReferral();
    renderHUD();
  </script>
</body>
</html>
